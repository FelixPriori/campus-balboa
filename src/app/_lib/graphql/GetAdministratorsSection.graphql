query GetAdministratorsSection($id: String!, $locale: String!) {
  pageSection(id: $id, locale: $locale) {
    title
    anchor
    componentsCollection(limit: 10) {
      items {
        ... on Instructor {
          __typename
          sys {
            id
          }
          name
          pronouns
          title
          biography {
            json
            links {
              assets {
                block {
                  sys {
                    id
                  }
                  url
                  description
                }
              }
            }
          }
          avatar {
            url
            title
          }
        }
      }
    }
  }
}
